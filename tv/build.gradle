plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simpletv.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.simpletv.launcher'
        minSdk 25          // Fire OS 6+
        targetSdk 30       // Fire OS 8 is Android 11 (API 30)
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
